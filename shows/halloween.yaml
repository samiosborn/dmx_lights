# shows/halloween.yaml

seed: 42

fixtures:
  - zq06141_1


phases:

  # Guests arriving
  - name: arrival
    duration: 60m

    colour:
      change_every: 3m
      choices:
        - effect: palette_fade
          palette: halloween_dark
          period: 25s

        - effect: palette_fade
          palette: halloween_spooky
          period: 30s

        - effect: palette_fade
          palette: halloween_pumpkin
          period: 22s

        - effect: static_colour
          colour: purple

        - effect: static_colour
          colour: orange

    movement:
      change_every: 25s
      choices:
        - effect: static_position
          position: centre
          motor_speed: 144

        - effect: sweep
          start: centre_left
          end: centre_right
          period: 16s
          motor_speed: 128

        - effect: sweep
          start: left
          end: right
          period: 20s
          motor_speed: 128

        - effect: position_sequence
          positions: [centre_left, centre, centre_right, centre]
          interval: 3s
          motor_speed: 128

    intensity:
      change_every: 2m
      choices:
        - effect: static_intensity
          value: 0.7

        - effect: pulse
          minimum: 0.45
          maximum: 0.85
          period: 8s

    strobe:
      effect: strobe_burst
      interval: 30s
      duration: 0.8s
      value: 160


  # Energy starts building
