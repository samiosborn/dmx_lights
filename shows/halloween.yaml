        - effect: rainbow
          period: 30s

        - effect: random_colour
          palette: halloween_spooky
          interval: 5s

    movement:
      change_every: 20s
      choices:
        - effect: sweep
          start: left
          end: right
          period: 12s
          motor_speed: 112

        - effect: sweep
          start: centre_left
          end: centre_right
          period: 9s
          motor_speed: 96

        - effect: position_sequence
          positions: [left, centre, right, centre]
          interval: 2.5s
          motor_speed: 112

        - effect: random_position
          positions: [left, centre_left, centre, centre_right, right]
          interval: 3s
          motor_speed: 112

    intensity:
      change_every: 90s
      choices:
        - effect: static_intensity
          value: 0.85

        - effect: pulse
          minimum: 0.5
          maximum: 1.0
          period: 5s

    strobe:
      effect: strobe_burst
      interval: 15s
      duration: 1s
      value: 176

    special:
      change_every: 4m
      choices:
